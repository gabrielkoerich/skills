name: Update README & Deploy

on:
  push:
    branches: [main]
    # paths:
    #   - '*/SKILL.md'
    #   - '.github/workflows/*'

env:
  # Set your custom domain here, or leave empty to use root-relative URLs (/)
  # Root-relative URLs work with any domain (GitHub Pages or custom)
  # Example: BASE_URL: https://docs.example.com
  BASE_URL: "https://projects.gabrielkoerich.com/skills"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python .github/workflows/update-readme.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update skills in README"
          file_pattern: README.md

  build:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs with zola-builder
        uses: gabrielkoerich/zola-builder@main
        with:
          base-url: ${{ env.BASE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .zola-build/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
