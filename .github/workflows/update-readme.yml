name: Update README & Deploy

on:
  push:
    branches: [main]
    # paths:
    #   - '*/SKILL.md'
    #   - '.github/workflows/*'

env:
  # Set your custom domain here, or leave empty to use root-relative URLs (/)
  # Root-relative URLs work with any domain (GitHub Pages or custom)
  # Example: BASE_URL: https://docs.example.com
  BASE_URL: "https://projects.gabrielkoerich.com/skills"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python .github/workflows/update-readme.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update skills in README and marketplace"
          file_pattern: "README.md .claude-plugin/marketplace.json */.claude-plugin/plugin.json"

  build:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy docs from the README with the shared theme
        id: deployment
        uses: gabrielkoerich/zola-docs-action@v1
        with:
          readme: README.md
          base-url: ${{ env.BASE_URL }}
          zola-version: "0.19.2"
          deploy: "true"
          cloudflare-token: ${{ secrets.CF_API_TOKEN }}
          indexnow-key: 1d0e571ac19d48adf5e168b3585deb31
