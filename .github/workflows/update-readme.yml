name: Update README

on:
  push:
    branches: [main]
    paths:
      - '*/SKILL.md'
      - '.github/workflows/update-readme.py'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python .github/workflows/update-readme.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update skills in README"
          file_pattern: README.md
