version: 1
display_name: "Conventional Commits"
short_description: "Conventional Commits specification is a lightweight convention on top of commit messages. It provides an easy set of rules for creating an explicit commit history, which makes it easier to write automated tools on top of. This convention dovetails with [SemVer](http://semver.org), by describing the features, fixes, and breaking changes made in commit messages."
default_prompt: "Use conventional commits for this task."
